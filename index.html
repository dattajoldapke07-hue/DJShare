<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJShare | Secure File Transfer</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050807;color:#00ff88;
 font-family:monospace;min-height:100vh
}
header{
 text-align:center;padding:25px 10px;
 border-bottom:1px solid #00ff88;
 text-shadow:0 0 12px #00ff88
}
h1{font-size:34px;letter-spacing:3px}
main{max-width:480px;width:92%;margin:30px auto}
.panel{
 background:#09110e;border:1px solid #00ff8870;
 border-radius:12px;padding:22px;margin-bottom:22px
}
h2{font-size:18px}
input,button{
 width:100%;padding:13px;margin-top:12px;
 border-radius:6px;font-family:monospace
}
input{
 background:#030605;color:#00ff88;
 border:1px solid #286044
}
button{
 background:#00ff88;color:#001b0e;
 border:0;font-weight:bold;cursor:pointer
}
.cancel{
 background:transparent;color:#00ff88;
 border:1px solid #00ff88
}
.status{
 margin-top:15px;line-height:1.8;
 font-size:13px;overflow-wrap:anywhere
}
a{color:#00ff88}
footer{text-align:center;padding:20px;color:#527463}
</style>
</head>

<body>
<header>
 <h1>DJ<span style="color:white">SHARE</span></h1>
 <p>SECURE FILE TRANSFER // SHARE ANYTHING</p>
</header>

<main>
 <section class="panel">
  <h2>&gt; SEND FILES</h2>
  <p>Select files to share with another device.</p>

  <input type="file" id="files" multiple>

  <button id="sendBtn" onclick="sendFiles()">SEND FILES</button>
  <button class="cancel" onclick="cancelSend()">CANCEL</button>

  <div class="status" id="sendStatus">
   &gt; WAITING FOR FILES
  </div>
 </section>

 <section class="panel">
  <h2>&gt; RECEIVE FILES</h2>
  <p>Enter the code shared by the sender.</p>

  <input id="code" placeholder="Example: DJ729"
         maxlength="5" autocomplete="off">

  <button onclick="receiveFiles()">CONNECT</button>

  <div class="status" id="receiveStatus">
   &gt; WAITING FOR CODE
  </div>
 </section>
</main>

<footer>DJSHARE // YOUR FILES, YOUR CONTROL</footer>

<script>
let controller = null;

async function sendFiles(){
 const input = document.getElementById("files");
 const status = document.getElementById("sendStatus");
 const btn = document.getElementById("sendBtn");

 if(!input.files.length){
  status.textContent = "> ERROR: SELECT FILES FIRST";
  return;
 }

 const form = new FormData();
 for(const file of input.files){
  form.append("files", file);
 }

 controller = new AbortController();
 btn.disabled = true;
 btn.textContent = "UPLOADING...";
 status.textContent = "> UPLOADING FILES...";

 try{
  const response = await fetch("/api/send",{
   method:"POST",
   body:form,
   signal:controller.signal
  });

  const result = await response.json();

  if(!response.ok){
   throw new Error(result.error || "Upload failed");
  }

  status.innerHTML =
   "> FILES UPLOADED<br>" +
   "> SHARE CODE: <strong>" + result.code + "</strong><br>" +
   "> SEND THIS LINK TO RECEIVER:<br>" +
   '<a href="' + result.link + '">' +
   result.link + '</a><br>' +
   "> CODE EXPIRES IN 10 MINUTES";

 }catch(error){
  if(error.name === "AbortError"){
   status.textContent = "> TRANSFER CANCELLED";
  }else{
   status.textContent = "> ERROR: " + error.message;
  }
 }finally{
  controller = null;
  btn.disabled = false;
  btn.textContent = "SEND FILES";
 }
}

function cancelSend(){
 if(controller){
  controller.abort();
 }
 document.getElementById("files").value = "";
 document.getElementById("sendStatus").textContent =
  "> SELECTION CLEARED";
}

function receiveFiles(){
 const code = document.getElementById("code")
  .value.trim().toUpperCase();

 const status = document.getElementById("receiveStatus");

 if(!/^DJ[0-9]{3}$/.test(code)){
  status.textContent = "> ENTER A CODE LIKE DJ729";
  return;
 }

 window.location.href =
  "/receive?code=" + encodeURIComponent(code);
}
</script>
</body>
</html>
